<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investing Aura Graph</title>
<script>
  // The graph now lives in index.html#graph. Carry an old graph.html#<slug> deep link across as the focused node.
  var slug = decodeURIComponent(location.hash.slice(1));
  try { if (slug) localStorage.setItem("aura:gfocus", JSON.stringify(slug)); } catch (e) {}
  location.replace("index.html#graph");
</script>
<p>The graph now lives in the main page: <a href="index.html#graph">open it</a>.</p>
