<title>Backchannel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Mono:wght@400;500&family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,400&display=swap" rel="stylesheet">
<style>
/* Layout: a ledger. A brief of grouped insight cards up front; dense tables behind it; a focus-first network graph; dossiers slide in from the right. */
:root{
  --bg:#f4f5f8; --panel:#ffffff; --ink:#151a24; --muted:#5a6273; --line:#e2e5eb; --chip:#eef0f5; --row-hover:#f3f5fa;
  --accent:#3346d3; --accent-soft:#e9ecfd; --good:#0b7a6c; --good-soft:#dcf4ef; --warn:#9a5b00; --warn-soft:#fbf0dc;
  --n-person:#0e8f7e; --n-firm:#4054e0; --n-company:#e08a12; --n-lp:#b4359f; --glow:rgba(51,70,211,.16);
  --e-co:rgba(14,143,126,.62); --e-inv:rgba(224,138,18,.42); --e-at:rgba(64,84,224,.38); --e-knows:rgba(90,98,115,.28); --e-lp:rgba(180,53,159,.5);
  --st-early:#13895a; --st-a:#2272b8; --st-mid:#8045b8; --st-late:#c04a1f;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-display:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c0f16; --panel:#141924; --ink:#e8ebf2; --muted:#8e97a9; --line:#252c3a; --chip:#1c2331; --row-hover:#1a2030;
    --accent:#8f9dff; --accent-soft:#1f2550; --good:#5fe0cd; --good-soft:#113530; --warn:#f3c46d; --warn-soft:#382a10;
    --n-person:#36d1bb; --n-firm:#8a98ff; --n-company:#f7b03c; --n-lp:#e27ad2; --glow:rgba(143,157,255,.22);
    --e-co:rgba(54,209,187,.6); --e-inv:rgba(247,176,60,.38); --e-at:rgba(138,152,255,.4); --e-knows:rgba(142,151,169,.28); --e-lp:rgba(226,122,210,.5);
    --st-early:#4fd08f; --st-a:#6cb4f0; --st-mid:#b98cf0; --st-late:#f2895a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0f16; --panel:#141924; --ink:#e8ebf2; --muted:#8e97a9; --line:#252c3a; --chip:#1c2331; --row-hover:#1a2030;
    --accent:#8f9dff; --accent-soft:#1f2550; --good:#5fe0cd; --good-soft:#113530; --warn:#f3c46d; --warn-soft:#382a10;
    --n-person:#36d1bb; --n-firm:#8a98ff; --n-company:#f7b03c; --n-lp:#e27ad2; --glow:rgba(143,157,255,.22);
    --e-co:rgba(54,209,187,.6); --e-inv:rgba(247,176,60,.38); --e-at:rgba(138,152,255,.4); --e-knows:rgba(142,151,169,.28); --e-lp:rgba(226,122,210,.5);
    --st-early:#4fd08f; --st-a:#6cb4f0; --st-mid:#b98cf0; --st-late:#f2895a;
    color-scheme:dark;
}
/* Couture: an optional monochrome house style (ivory, ink, one gold accent; high-contrast serif display). */
:root[data-style="couture"]{
  --bg:#f6f2e9; --panel:#fffdf7; --ink:#0d0d0d; --muted:#6a645a; --line:#e3dccd; --chip:#f0eadc; --row-hover:#f3eee2;
  --accent:#0d0d0d; --accent-soft:#ece5d3; --good:#3d5a4c; --good-soft:#e3ebe4; --warn:#9c7a26; --warn-soft:#f4ead0;
  --n-person:#1f1f1f; --n-firm:#9c7a26; --n-company:#8c8273; --n-lp:#5b4a7a; --glow:rgba(156,122,38,.18);
  --e-co:rgba(13,13,13,.5); --e-inv:rgba(156,122,38,.45); --e-at:rgba(91,74,122,.35); --e-knows:rgba(106,100,90,.28); --e-lp:rgba(91,74,122,.5);
  --f-display:"Bodoni Moda",Didot,"Bodoni 72",Georgia,serif; --gold:#b08d2e;
}
@media (prefers-color-scheme: dark){
  :root[data-style="couture"]:not([data-theme="light"]){
    --bg:#0a0a0a; --panel:#141413; --ink:#f1ece0; --muted:#9a9384; --line:#2a2824; --chip:#1d1c19; --row-hover:#1b1a17;
    --accent:#f1ece0; --accent-soft:#2a2720; --good:#9cc4ad; --good-soft:#1a2620; --warn:#d9b75e; --warn-soft:#2d2512;
    --n-person:#f1ece0; --n-firm:#d9b75e; --n-company:#a39a8a; --n-lp:#a996cf; --glow:rgba(217,183,94,.2);
    --e-co:rgba(241,236,224,.45); --e-inv:rgba(217,183,94,.4); --e-at:rgba(169,150,207,.35); --e-knows:rgba(154,147,132,.28); --e-lp:rgba(169,150,207,.5);
    --gold:#d9b75e;
  }
}
:root[data-style="couture"][data-theme="dark"]{
  --bg:#0a0a0a; --panel:#141413; --ink:#f1ece0; --muted:#9a9384; --line:#2a2824; --chip:#1d1c19; --row-hover:#1b1a17;
  --accent:#f1ece0; --accent-soft:#2a2720; --good:#9cc4ad; --good-soft:#1a2620; --warn:#d9b75e; --warn-soft:#2d2512;
  --n-person:#f1ece0; --n-firm:#d9b75e; --n-company:#a39a8a; --n-lp:#a996cf; --glow:rgba(217,183,94,.2);
  --e-co:rgba(241,236,224,.45); --e-inv:rgba(217,183,94,.4); --e-at:rgba(169,150,207,.35); --e-knows:rgba(154,147,132,.28); --e-lp:rgba(169,150,207,.5);
  --gold:#d9b75e;
}
[data-style="couture"] .brand h1{font:500 34px/1 var(--f-display);text-transform:uppercase;letter-spacing:.22em;padding-bottom:6px;border-bottom:1px solid var(--ink)}
[data-style="couture"] .brand h1 .bk{color:var(--gold)}
[data-style="couture"] .tag{font:italic 400 16px var(--f-display)}
[data-style="couture"] h2,[data-style="couture"] h3,[data-style="couture"] .card h3,[data-style="couture"] .gpanel h3,[data-style="couture"] .md h1{font-family:var(--f-display);letter-spacing:.01em}
[data-style="couture"] #tabs button{text-transform:uppercase;letter-spacing:.12em;font-size:11.5px}
[data-style="couture"] .pl,[data-style="couture"] .md a{text-decoration-color:var(--gold)}
[data-style="couture"] .docnote{margin:6px 0 10px;padding:8px 12px;border-left:3px solid var(--warn);background:var(--warn-soft);border-radius:0 6px 6px 0;font-size:13.5px}
.dl1{margin:12px 0 4px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.dl1 h2{font-size:14px;margin:0 0 8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.dl1 .dls{display:flex;flex-wrap:wrap;gap:6px}
.dl1 .dc{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-left:3px solid var(--st,var(--line));border-radius:6px;padding:3px 8px;background:var(--bg);cursor:pointer;font-size:13px}
.dl1 .dc:hover{border-color:var(--accent)}
.dl1 .dc .dm{color:var(--muted);font:11.5px var(--f-data)}
.dl1 .dc.led{background:var(--accent-soft)}
.hotb{font:600 10px/1 var(--f-data);text-transform:uppercase;letter-spacing:.05em;padding:2px 5px;border-radius:4px;background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.dl1 .more{margin-top:8px;font-size:12.5px;color:var(--muted)}
.dl1 .intel{display:grid;gap:8px;margin-top:6px}
.dl1 .intel .it{border-left:3px solid var(--good);padding-left:10px;font-size:13.5px}
.dl1 .intel .it.s2{border-left-color:var(--warn)}
.dl1 .intel .q{color:var(--muted);font-style:italic;font-size:12.5px}
.tb-role{font:600 10.5px/1 var(--f-data);text-transform:uppercase;letter-spacing:.05em;padding:3px 6px;border-radius:4px;white-space:nowrap;background:var(--chip);color:var(--ink)}
.tb-role.r-signed{background:var(--warn-soft);color:var(--warn)} .tb-role.r-tested,.tb-role.r-evaluated{background:var(--good-soft);color:var(--good)} .tb-role.r-board{background:var(--accent-soft);color:var(--accent)}
.tb-q{color:var(--muted);font-style:italic;font-size:12.5px}
.tbwho{margin:12px 0 4px;padding:10px 14px;border:1px solid var(--line);border-left:3px solid var(--good);border-radius:8px;background:var(--panel);font-size:13.5px}
.tbwho h2{font-size:14px;margin:0 0 6px}
.tbwho .row{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;margin:4px 0}
.colophon{font:italic 13px var(--f-display);text-align:center;letter-spacing:.02em}
.style-sw{margin-left:auto;font:500 11px var(--f-data);text-transform:uppercase;letter-spacing:.1em;background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 10px;cursor:pointer}
.style-sw:hover{color:var(--ink);border-color:var(--ink)}
/* Round stages: green = seed, blue = Series A, violet = Series B, orange = Series C and later / growth */
.stg{display:inline-flex;align-items:center;gap:5px;font:500 11.5px var(--f-data);color:var(--st);white-space:nowrap}
.stg::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--st);flex:none}
.stg-early,.sd-early{--st:var(--st-early)} .stg-a,.sd-a{--st:var(--st-a)} .stg-mid,.sd-mid{--st:var(--st-mid)} .stg-late,.sd-late{--st:var(--st-late)}
.sdots{display:inline-flex;gap:3px;align-items:center}
.sd{width:9px;height:9px;border-radius:50%;background:var(--st,var(--line));display:inline-block}
.chip.sc{border-left:3px solid var(--st,var(--line))}
.tlr.sc{border-left:3px solid var(--st,var(--line));padding-left:7px}
.slegend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin:6px 0 10px}
.mix{display:grid;gap:4px;margin:8px 0}
.mixbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);max-width:320px}
.mixbar span{background:var(--st)}
.mixlab{font:11.5px var(--f-data);color:var(--muted)}
/* Conviction bands */
.band{display:inline-block;font:600 10.5px/1 var(--f-data);text-transform:uppercase;letter-spacing:.05em;padding:3px 6px;border-radius:4px;white-space:nowrap;border:1px solid transparent}
.b-double-down,.b-core{background:var(--good-soft);color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.b-watch,.b-follow{background:var(--warn-soft);color:var(--warn)}
.b-fade,.b-noise{background:var(--chip);color:var(--muted)}
.b-exited{background:transparent;color:var(--muted);border-color:var(--line)}
.b-too-early-to-tell{background:var(--chip);color:var(--muted);border-style:dashed;border-color:var(--line)}
.ratio{display:inline-flex;height:6px;width:60px;border-radius:3px;overflow:hidden;background:var(--line);vertical-align:middle;margin-left:4px}
.ratio span{background:var(--st)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
header,main{max-width:1400px;margin:0 auto}
header{padding-block:20px 0}
h1{font:600 30px/1.1 var(--f-display);margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);font:12px var(--f-data)}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.brand h1{margin:0}
.brand h1 .bk{color:var(--accent)}
.tag{background:none;border:0;padding:0;font:italic 14px var(--f-body);color:var(--muted);cursor:pointer;text-align:left}
.tag:hover{color:var(--ink)}
.colophon{max-width:100ch;margin:36px 0 24px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
nav{display:flex;gap:2px;margin-top:16px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;padding:10px 12px;font:inherit;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
nav .n{font:11px var(--f-data);color:var(--muted);margin-left:5px}
main{padding-block:14px 56px}
.intro{color:var(--muted);font-size:13px;margin:0 0 12px;max-width:80ch}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input[type=search],.bar select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.bar input[type=search]{flex:1;min-width:200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 11px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tog{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.count{color:var(--muted);font:12px var(--f-data);margin-left:auto}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 11px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.sm{padding:2px 8px;font-size:12px}
.btn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.btn.no.on{background:var(--chip);color:var(--muted);border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,.pl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
th.sorted{color:var(--ink)} th .arr{font-size:10px;margin-left:3px}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--row-hover)}
tr.click{cursor:pointer}
.name{font-weight:600}
.muted{color:var(--muted)}
.take{color:var(--muted);max-width:520px}
.num,.date{font:12px var(--f-data);white-space:nowrap}
.num{text-align:right}
.chip{display:inline-block;background:var(--chip);border-radius:4px;padding:1px 6px;margin:0 3px 3px 0;font-size:11px;white-space:nowrap}
.fund .chip{white-space:normal;max-width:100%;overflow-wrap:anywhere}
.chip.link{cursor:pointer} .chip.link:hover{background:var(--accent-soft);color:var(--accent)}
.pill{display:inline-block;font:500 11px var(--f-data);padding:1px 7px;border-radius:999px;white-space:nowrap}
.p-high{background:var(--good-soft);color:var(--good)}
.t-1{background:var(--accent-soft);color:var(--accent)}
.t-2{background:var(--good-soft);color:var(--good)}
.p-medium{background:var(--warn-soft);color:var(--warn)}
.p-low,.p-skip,.t-3,.t-4,.t-5{background:var(--chip);color:var(--muted)}
a{color:var(--accent)}
.pl{color:var(--accent);cursor:pointer;font-weight:500}
.pl:hover{text-decoration:underline}
.more{display:block;margin:14px auto 0}

.av{position:relative;display:inline-grid;place-items:center;flex:none;width:30px;height:30px;border-radius:50%;overflow:hidden;
  background:hsl(var(--h,200) 45% 88%);color:hsl(var(--h,200) 45% 28%);font:600 11px var(--f-body);vertical-align:middle}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;background:transparent;color:transparent}
.av.lg{width:52px;height:52px;font-size:17px} .av.md{width:40px;height:40px;font-size:14px}
.who{display:inline-flex;align-items:center;gap:9px}
.funds{display:grid;gap:14px}
.fund{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.fund h3{margin:0;font:600 19px var(--f-display);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fund .crux{color:var(--muted);margin:6px 0 12px;max-width:100ch;font-size:13.5px}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.mem{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.mem .nm{font-weight:600} .mem .rl{font-size:12px;color:var(--muted)}
.mem .dl{margin-top:6px;display:flex;flex-wrap:wrap;gap:3px}
.chip.lead{background:var(--accent-soft);color:var(--accent)}
.chip.t1{border:1px solid color-mix(in srgb, var(--accent) 40%, transparent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .av{background:hsl(var(--h,200) 30% 24%);color:hsl(var(--h,200) 60% 82%)}}
:root[data-theme="dark"] .av{background:hsl(var(--h,200) 30% 24%);color:hsl(var(--h,200) 60% 82%)}
.cards{display:grid;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card h3{margin:0;font:600 17px/1.3 var(--f-display);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .crux{color:var(--muted);margin:6px 0 10px;max-width:90ch}
.ins{border-top:1px solid var(--line);padding:9px 0 2px;display:grid;grid-template-columns:minmax(0,1fr);gap:3px;max-width:100ch;overflow-wrap:anywhere}
.ins .q{color:var(--muted);font-style:italic;font-size:13px}
.ins .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.card .toggle{margin-top:8px}

.gtop{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.gtop input[type=search],.gtop select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.gtop input[type=search]{flex:1 1 240px;min-width:200px}
.gchips{display:flex;gap:4px;flex-wrap:wrap}
.gchip{font:inherit;font-size:12px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:4px 10px;cursor:pointer;opacity:.55}
.gchip.on{opacity:1;color:var(--ink);border-color:color-mix(in srgb, var(--c) 55%, var(--line))}
.gchip .sw{color:var(--c);font-size:12px;line-height:1}
.gchip .ln{display:inline-block;width:16px;height:3px;border-radius:2px;background:var(--c)}
.gwrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px}
.gbox{position:relative;min-width:0}
#graph{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;height:min(76vh,820px);min-height:520px;min-width:0;
  background:radial-gradient(circle, color-mix(in srgb, var(--muted) 22%, transparent) 1px, transparent 1.2px) 0 0/22px 22px, var(--panel)}
.gnote{position:absolute;z-index:2;max-width:calc(100% - 140px);left:12px;top:10px;font:12px var(--f-data);color:var(--muted);background:var(--panel);padding:3px 8px;border-radius:6px;border:1px solid var(--line)}
.gzoom{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.gpanel{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:16px;overflow-y:auto;height:min(76vh,820px);min-height:520px;min-width:0}
.gpanel h3{margin:0;font:600 20px/1.2 var(--f-display)}
.gpanel h4{margin:16px 0 6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.gcard-head{display:flex;gap:10px;align-items:flex-start}
.kdot{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:color-mix(in srgb, var(--c) 16%, transparent);color:var(--c);font-size:13px;flex:none}
.kdot.sm{width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
.gpills{margin:8px 0 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.gcrux{margin:10px 0 0;color:var(--ink);font-size:13.5px;line-height:1.5}
.gstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}

// ---- link names inside write-ups to their profiles (or to unprofiled leads) ----
function mentionIndex() {
  const ix = new Map(), add = (name, val) => { name = String(name || "").replace(/\s*\(.*?\)\s*/g, " ").replace(/\s+/g, " ").trim(); if (name.length >= 5 && !ix.has(name)) ix.set(name, val); };
  [...A.people, ...A.firms, ...A.lps].forEach(d => add(d.name, {open: d.slug}));
  // every company we have rounds, tags or a note for, plus its short form ("Ineffable" for "Ineffable Intelligence")
  const SUFFIX = /\s+(Intelligence|Labs?|AI|Inc\.?|Technologies|Technology|Systems|Computer|Computing|Robotics|Corporation|Corp\.?|Company|Co\.?|Holdings|Research|Bio|Therapeutics)$/;
  // short forms that are ordinary words at the start of a sentence stay unlinked
  const SHORT_STOP = new Set(["Physical", "Scale", "Safe", "General", "World", "Character", "Open", "Magic", "Essential", "Humans", "Applied", "Perfect", "Basis", "Thinking", "Standard", "Periodic", "Black", "Deep", "Cognition", "Hidden", "Liquid", "Figure", "Field", "Common", "Human", "Prime", "Parallel"]);
  V.cos.forEach(c => add(c.name, {open: "co:" + c.slug}));
  V.cos.forEach(c => { const short = c.name.replace(SUFFIX, ""); if (short !== c.name && /^[A-Z]/.test(short) && !SHORT_STOP.has(short)) add(short, {open: "co:" + c.slug}); });
  (V.leadrows || []).filter(l => !l.profiled && l.kind !== "company" && (l.kind !== "person" || /\s/.test(l.name)) && !/needs-id/i.test(l.name)).forEach(l => add(l.name, {lead: l.slug}));
  const names = [...ix.keys()].sort((a, b) => b.length - a.length).map(n => n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  return {ix, re: new RegExp(`(?<![\\w’'])(${names.join("|")})(?![\\w])`, "g"), leads: !!V.leadrows};
}
let MIX = null;
function linkMentions(root, self) {
  linkMentions.n ||= 0;
  if (!MIX || (!MIX.leads && V.leadrows)) MIX = mentionIndex();
  const done = new Set([self, "co:" + self]), walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement.closest("a, code, pre, h1, .pl, .who, .mention, .docbar, .team, .dl1") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => {
    const s = node.nodeValue; MIX.re.lastIndex = 0; let m, last = 0, frag = null;
    while ((m = MIX.re.exec(s))) {
      const v = MIX.ix.get(m[1]), isCo = (v.open || "").startsWith("co:");
      // people and funds link once per write-up; companies link once per paragraph, list item or table cell
      const blk = isCo ? node.parentElement.closest("p, li, td, th, h2, h3, h4, blockquote") : null;
      if (blk && !blk.dataset.mk) blk.dataset.mk = String(++linkMentions.n);
      const key = (v.open || "lead:" + v.lead) + (blk ? "|" + blk.dataset.mk : "");
      if (done.has(key) || (!isCo && done.has(v.open)) || v.open === "co:" + self) continue;
      done.add(key);
      frag ||= document.createDocumentFragment();
      frag.append(s.slice(last, m.index));
      const sp = document.createElement("span"); sp.className = "mention" + (v.lead ? " lead" : "") + (v.open && hasKey(v.open) ? " k" : ""); sp.tabIndex = 0;
      if (v.lead) sp.dataset.lead = v.lead; else sp.dataset.open = v.open;
      sp.textContent = m[1]; frag.append(sp); last = m.index + m[1].length;
    }
    if (frag) { frag.append(s.slice(last)); node.replaceWith(frag); }
  });
}

function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 1800); }

function table(el, cols, rows, opts = {}) {
  let sort = opts.sort || [cols[0].k, 1], limit = opts.limit || 400;
  function draw() {
    const [sk, dir] = sort, col = cols.find(c => c.k === sk) || {};
    const val = r => col.v ? col.v(r) : r[sk];
    const sorted = rows.slice().sort((a, b) => {
      const x = val(a), y = val(b);
      if (col.num) return ((Number(x) || 0) - (Number(y) || 0)) * dir;
      const xs = String(x ?? ""), ys = String(y ?? "");
      if (!xs && ys) return 1; if (xs && !ys) return -1;
      return xs.localeCompare(ys) * dir;
    });
    const shown = sorted.slice(0, limit);
    el.innerHTML = `<div class="wrap"><table><thead><tr>${cols.map(c => `<th data-k="${c.k}" class="${c.k === sk ? "sorted" : ""}${c.num ? " num" : ""}">${c.t}${c.k === sk ? `<span class="arr">${dir > 0 ? "▲" : "▼"}</span>` : ""}</th>`).join("")}</tr></thead><tbody>${
      shown.map(r => `<tr class="${opts.open ? "click" : ""}"${opts.open ? ` data-open="${esc(opts.open(r))}"` : ""}>${cols.map(c => `<td class="${c.num ? "num" : ""}" data-label="${esc(c.t)}">${c.h ? c.h(r) : esc(r[c.k])}</td>`).join("")}</tr>`).join("")
      || `<tr><td colspan="${cols.length}" class="muted">${esc(opts.empty || pick(EMPTY))}</td></tr>`}</tbody></table></div>` +
      (sorted.length > limit ? `<button class="btn more" data-more="1">Show ${Math.min(400, sorted.length - limit)} more (${sorted.length - limit} hidden)</button>` : "");
    el.querySelectorAll("th").forEach(th => th.onclick = () => {
      const k = th.dataset.k; const c = cols.find(c => c.k === k);
      sort = [k, sort[0] === k ? -sort[1] : (c.num ? -1 : 1)]; draw();
    });
    const m = el.querySelector("[data-more]"); if (m) m.onclick = () => { limit += 400; draw(); };
  }
  draw();
}
const seg = (id, opts, cur) => `<div class="seg" id="${id}">${opts.map(([v, l]) => `<button data-v="${esc(v)}" class="${v === cur ? "on" : ""}">${esc(l)}</button>`).join("")}</div>`;
const sel = (id, label, opts, cur) => `<select id="${id}" aria-label="${esc(label)}"><option value="">${esc(label)}</option>${opts.map(o => `<option${o === cur ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`;

VIEWS.queue = {
  label: "Queue", get n() { return Object.entries(picks()).filter(([k, v]) => v === "keep" && !bySlug[k]).length; }, needs: ["leads"],
  render(m) {
    const KINDS = [["person", "Person"], ["firm", "Fund"], ["lp", "LP"], ["company", "Company"]];
    m.innerHTML = `<p class="intro">${PICKS.shared
        ? `<b>Your research queue.</b> Everything here is researched first in the next sweep. Add anyone by name, or tap <b>Research this person next</b> on any grey-underlined name. A pick turns <b>Done</b> once its profile lands.`
        : `<b>Your research queue, saved in this browser only.</b> To send picks straight to the research sweep, use the private Back Chanel artifact on claude.ai. Here, use <b>Copy queue</b> and paste it to Claude.`}</p>
      <form class="bar" id="qadd"><input id="qname" placeholder="Add a person, fund, LP or company by name…" autocomplete="off" required>
        <select id="qkind" aria-label="Kind">${KINDS.map(([v, l]) => `<option value="${v}">${l}</option>`).join("")}</select>
        <input id="qnote" placeholder="Why (optional)"><button class="btn on" type="submit">Queue it</button>
        <button class="btn" type="button" id="qcopy">Copy queue</button></form><div id="qbody"></div>`;
    const draw = () => {
      const tri = picks(), meta = store.get("pickmeta", {}), L = leadBySlug();
      const row = k => { const l = L[k] || {}, d = bySlug[k], mt = meta[k] || {};
        return {k, name: d?.name || l.name || mt.name || k, kind: d?.kind || l.kind || mt.kind || "", why: mt.note || (l.whys || [])[0] || "", via: l.n_via || 0, done: !!d}; };
      const keep = Object.keys(tri).filter(k => tri[k] === "keep").map(row).sort((a, b) => a.done - b.done || b.via - a.via);
      const skip = Object.keys(tri).filter(k => tri[k] === "skip").map(row);
      const tr = r => `<tr><td>${r.done ? link(r.k, r.name) : `<span class="name">${esc(r.name)}</span>`}</td><td><span class="chip">${esc(KIND[r.kind] || r.kind || "?")}</span></td>
        <td>${r.done ? `<span class="pill p-high">Done</span>` : `<span class="pill p-medium">Queued</span>`}</td><td class="num">${r.via || ""}</td><td class="muted">${clip(r.why, 160)}</td>
        <td><button class="btn sm" data-qrm="${esc(r.k)}">${r.done ? "Clear" : "Remove"}</button></td></tr>`;
      $("qbody").innerHTML = `<h3>Queued <span class="muted num">${keep.filter(r => !r.done).length}</span>${keep.some(r => r.done) ? ` <span class="muted">· done ${keep.filter(r => r.done).length}</span>` : ""}</h3>
        ${keep.length ? `<div class="wrap"><table><thead><tr><th>Name</th><th>Kind</th><th>Status</th><th class="num">Mentioned by</th><th>Why</th><th></th></tr></thead><tbody>${keep.map(tr).join("")}</tbody></table></div>`
          : `<p class="muted">Nothing queued yet. Add a name above, or open <a href="#leads">Leads</a> and press Keep.</p>`}
        ${skip.length ? `<details style="margin-top:16px"><summary class="muted">Skipped ${skip.length} (never researched)</summary><p>${skip.map(r => `<span class="chip">${esc(r.name)} <button class="btn sm" data-qrm="${esc(r.k)}" title="Undo skip">×</button></span>`).join(" ")}</p></details>` : ""}`;
      $("qbody").querySelectorAll("[data-qrm]").forEach(b => b.onclick = () => { setPick(b.dataset.qrm, null); draw(); tabs(); });
    };
    $("qadd").onsubmit = e => {
      e.preventDefault();
      const name = $("qname").value.trim(), slug = slugify(name); if (!slug) return;
      if (bySlug[slug]) { toast(`${bySlug[slug].name} is already profiled.`); return; }
      setPick(slug, "keep", {name, kind: $("qkind").value, note: $("qnote").value.trim()});
      $("qname").value = ""; $("qnote").value = ""; draw(); tabs();
      toast(PICKS.shared ? `Queued ${name} for the next sweep.` : `Queued ${name} in this browser.`);
    };
    $("qcopy").onclick = async () => {
      const tri = picks(), meta = store.get("pickmeta", {}), L = leadBySlug();
      const nm = k => bySlug[k]?.name || L[k]?.name || meta[k]?.name || k;
      const text = `Backchannel research queue\nResearch next: ${Object.keys(tri).filter(k => tri[k] === "keep" && !bySlug[k]).map(nm).join("; ") || "none"}\nSkip: ${Object.keys(tri).filter(k => tri[k] === "skip").map(nm).join("; ") || "none"}`;
      try { await navigator.clipboard.writeText(text); toast("Queue copied"); } catch { $("qbody").insertAdjacentHTML("afterbegin", `<textarea class="copy" readonly>${esc(text)}</textarea>`); }
    };
    draw();
  },
};

// ---- Technical buyers: the engineers and CTOs who tested, signed or were quoted on a deal ----
const TB_ROLES = {evaluated: "Evaluated", tested: "Tested", signed: "Signed", quoted: "Quoted"};
const tbRole = r => `<span class="tb-role r-${esc(r)}">${esc(TB_ROLES[r] || r)}</span>`;
const tbFor = {company: c => (V.tbuyers || []).filter(x => x.c === c), person: p => (V.tbuyers || []).filter(x => x.p === p)};
function lpAccess(lp) {
  // LP co-invest access: rounds where this allocator sat next to a GP. "LP link on record" = we have the commitment;
  // "inferred" = the allocator only shows up in the same (small) rounds, a lead to check, never proof.
  const e = (V.lpaccess || {})[lp]; if (!e) return "";
  const row = x => `${link(x.c, x.cn)} <span class="muted">${esc(x.r)}${x.d ? " · " + esc(x.d) : ""}${x.n ? " · " + x.n + " investors" : ""}</span>`;
  const conf = e.conf.map(g => `<div class="row"><b>${link(g.g, g.gn)}</b> <span class="pill">LP link on record</span><div class="muted">${g.rows.map(row).join("; ")}</div></div>`).join("");
  const cand = e.cand.map(g => `<div class="row"><b>${link(g.g, g.gn)}</b> <span class="pill">inferred from co-investing</span> <span class="muted num">${g.np} shared round${g.np === 1 ? "" : "s"}</span><div class="muted">${g.rows.map(row).join("; ")}</div></div>`).join("");
  return `<section class="tbwho"><h2>Co-invest access</h2><p class="muted">Rounds where this allocator invested directly alongside a fund. Hot-deal co-invest usually comes through a GP relationship, so a fund it keeps showing up next to is a lead on a commitment we haven't found.</p>` +
    (conf ? `<h3>Alongside funds it backs</h3>${conf}` : "") + (cand ? `<h3>Funds to check (no LP link on record yet)</h3>${cand}` : "") + `</section>`;
}

  return `<section class="tbwho"><h2>Who tested it <span class="muted num">${L.length}</span></h2>${L.map(x => `<div class="row">${link(x.p, x.pn)}${x.f ? ` <span class="muted">${link(x.f, x.fn)}</span>` : ""} ${tbRole(x.role)} <span>${esc(x.w)}</span>${x.q ? ` <span class="tb-q">“${esc(x.q)}”</span>` : ""} ${src(x.u)}</div>`).join("")}</section>`;
}

VIEWS.lps = {
  label: "LPs", n: A.meta.n_lp_distinct ?? "", needs: ["extra"],
  render(m) {
    const B = V.backers || [];
    const TYPES = ["endowment", "foundation", "pension", "sovereign", "fund-of-funds", "family office", "VC firm", "individual", "allocator", "unprofiled"].filter(t => B.some(b => b.lp_type === t));
    const NICE = {calpers: "CalPERS", calstrs: "CalSTRS", utimco: "UTIMCO", "oregon-operf": "Oregon OPERF", ersri: "ERSRI", hoopp: "HOOPP", "florida-sba": "Florida SBA", "michigan-smrs": "Michigan SMRS",
      "massachusetts-prim": "Massachusetts PRIM", "fppa-colorado": "FPPA Colorado", "cpp-investments": "CPP Investments", icapital: "iCapital", nyscrf: "NYSCRF", wsib: "WSIB", "texas-trs": "Texas TRS", gic: "GIC", mgx: "MGX"};
    const UP = new Set(["ai", "ii", "iii", "iv", "uc", "ci", "bmo", "kbc", "us", "uk", "ifc", "eif", "sba"]);
    const lpName = b => NICE[b.lp] || (bySlug[b.lp] ? bySlug[b.lp].name.replace(/\s*\(.*?\)\s*/g, " ").trim() : b.lp_name.replace(/\b[A-Za-z]{2,4}\b/g, w => UP.has(w.toLowerCase()) || (w.length <= 3 && !/[aeiouy]/i.test(w)) ? w.toUpperCase() : w));
    // Resolve a manager name to a profiled fund even when the build couldn't: "Thrive Capital Partners" -> thrive-capital.
    const strip = k => k.replace(/-(?:capital|ventures|venture|partners|venture-partners|management|associates|vc)$/, "");
    const FIRM_IX = {ah: "andreessen-horowitz", a16z: "andreessen-horowitz", founders: "founders-fund", "general-catalyst-group": "general-catalyst"}, FIRM_S = {}, NOT_VC = new Set(["bain-capital"]);
    A.firms.forEach(f => [f.slug, slugify(f.name)].forEach(k => { FIRM_IX[k] ??= f.slug; FIRM_S[strip(k)] ??= f.slug; }));
    const firmFor = nm => { const k = slugify(nm), sk = strip(k); return FIRM_IX[k] || FIRM_IX[sk] || (sk !== k && FIRM_S[sk]) || (!NOT_VC.has(k) && FIRM_S[k]) || ""; };
    const tc = s => /[A-Z]{4}/.test(s) && s === s.toUpperCase() ? s.toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase()).replace(/\b(?:Lp|Llc|[IVX]+[ivx]+)\b/g, x => x.toUpperCase()) : s;
    const ROMAN = /^[IVXL]+(?:-[A-Z0-9]+)?$/, WORD = /^(?:\d+[A-Za-z]?|fund|funds|fd|opportunity|opportunities|growth|select|private|seed|co-invest|co-investment|spv|annex|strategic|access|feeder|india|china|israel|europe|london|bio|leaders|scout|scouts)$/i;
    // Split a fund vehicle name into its manager and the vehicle label: "Thrive Capital Partners IX, L.P." -> manager + "IX".
    const split = b => {
      const raw = String(b.fund).replace(/\(.*?\)/g, " ").replace(/,?\s*\bL\.?L?\.?[PC]\.?\s*$/i, "").replace(/\s+/g, " ").trim();
      const t = raw.split(" "), i = t.findIndex((w, j) => { w = w.replace(/[,.]$/, ""); return j > 0 && (ROMAN.test(w) || WORD.test(w)); });
      const nm = tc((i > 0 ? t.slice(0, i) : t).join(" ").replace(/[,&\s-]+$/, "")), label = i > 0 ? tc(t.slice(i).join(" ")) : "";
      const fs = b.firm && bySlug[b.firm] ? b.firm : firmFor(nm);
      if (fs) return {key: fs, name: bySlug[fs].name.replace(/\s*\(.*$/, ""), firm: fs, label: label || (firmFor(raw) === fs ? "" : tc(raw))};
      return {key: "~" + nm.toLowerCase().replace(/\bassoc\b/, "associates").replace(/[^a-z0-9]+/g, " ").trim(), name: nm, firm: "", label};
    };
    const facts = b => {
      const d = b.detail || "", v = (d.match(/vintage\s+(\d{4})/i) || [])[1] || String(b.since || "").slice(0, 4);
      const a = d.match(/\$\s?([\d,]+(?:\.\d+)?)\s?(million|billion|M|B)?\b/i); let amt = "";
      if (a) { const n = parseFloat(a[1].replace(/,/g, "")), u = (a[2] || "").toLowerCase();
        const val = u.startsWith("b") ? n * 1e9 : u.startsWith("m") ? n * 1e6 : n;
        if (val >= 1e5) amt = val >= 1e9 ? `$${+(val / 1e9).toFixed(2)}B` : `$${+(val / 1e6).toFixed(1)}M`; }
      return {v, amt};
    };
    // The same vehicle is often recorded twice ("Lux Ventures IX" and "Lux Ventures IX, L.P."): keep the best-sourced row.
    const HOWR = {filing: 5, "gp-said": 4, "lp-said": 4, press: 3, aggregator: 1, "": 0};
    const L = Object.values(B.map(b => ({...b, lpn: lpName(b), m: split(b), f: facts(b)})).reduce((acc, r) => {
      const k = r.lp + "|" + r.m.key + "|" + r.m.label.toLowerCase().replace(/\bfund\b|[^a-z0-9]/g, "") + "|" + r.status, o = acc[k];
      if (!o || HOWR[r.how] + !!r.f.amt > HOWR[o.how] + !!o.f.amt) acc[k] = r;
      return acc;
    }, {}));
    const covered = new Set(L.filter(b => b.m.firm && b.status !== "passed").map(b => b.m.firm));
    const bare = A.firms.filter(f => !covered.has(f.slug)).sort((a, b) => (RANK[lvl(b.lens_fit)] ?? 0) - (RANK[lvl(a.lens_fit)] ?? 0));
    if (S("lv", "lp") === "links") ST.lv = "lp";
    m.innerHTML = `<p class="intro">Who backs which fund. One row per LP or per fund; open a row to see each vehicle, its vintage, the amount on record and where the link comes from (a filing is strongest, an aggregator weakest).</p>
      <div class="bar"><input type="search" id="lq" placeholder="Search LPs, funds or vehicles…" value="${esc(S("lq", ""))}">
        ${seg("lv", [["lp", "By LP"], ["fund", "By fund"], ["alloc", "Allocator profiles"]], ST.lv)}
        ${sel("lt", "Any LP type", TYPES, S("lt", ""))}${sel("lh", "Any source", ["filing", "gp-said", "lp-said", "press", "aggregator"], S("lh", ""))}
        <label class="tog"><input type="checkbox" id="lpf" ${S("lpf", false) ? "checked" : ""}> Funds we've profiled only</label><span class="count" id="lc"></span></div>
      <div id="lp-body"></div>`;

// ================= Graph tab: a chooser and four lenses =================
// Each lens and focus is a URL: #graph, #graph/company/<slug>, #graph/fund/<slug>, #graph/person/<slug>,
// #graph/lp/<slug>, #graph/net/<id> (any node as a small network), #graph/together[/partners], #graph/network.
// Shared index over the graph part: lookups, links by type, and an importance score per node.
function gx() {
  if (gx.c && gx.g === V.graph) return gx.c;
  const G = V.graph, byId = dict(G.nodes.map(n => [n.id, n]));
  const inv = Object.create(null), at = Object.create(null), lp = Object.create(null);  // null-prototype: an id like "constructor" must not hit Object.prototype
  G.edges.forEach(e => {
    const put = m => { (m[e.source] ||= []).push(e); (m[e.target] ||= []).push(e); };
    if (e.types.includes("invested")) put(inv);
    if (e.types.includes("at")) put(at);
    if (e.types.includes("lp")) put(lp);
  });
  const firmByName = {};
  A.firms.forEach(f => { firmByName[f.name.toLowerCase()] = f.slug; firmByName[firmShort(f.name).toLowerCase()] = f.slug; });
  const names = {};  // display name -> id, for investors named in round rows
  [...A.people, ...A.firms, ...A.lps].forEach(d => { names[d.name.toLowerCase()] ??= d.slug; names[d.name.replace(/\s*\(.*?\)\s*/g, " ").trim().toLowerCase()] ??= d.slug; });
  G.nodes.forEach(n => { if (n.kind !== "company") names[n.name.toLowerCase()] ??= n.id; });
  const resolve = nm => { const k = String(nm || "").trim().toLowerCase(), s = slugify(nm); return names[k] || (bySlug[s] && bySlug[s].kind !== "company" ? s : byId[s] && byId[s].kind !== "company" ? s : ""); };
  const invW = id => (inv[id] || []).reduce((a, e) => a + e.w, 0);
  // Importance: the conviction model's investor score plus fit with the owner's lens, with a small term for
  // direct investments. Person-to-person "co-invested" links (angel-round cliques) never count.
  const convOf = n => {
    let cs = CONV_I[n.id]?.score;
    if (cs == null && n.kind === "person" && n.firm) cs = 0.6 * (CONV_I[firmByName[firmShort(n.firm).toLowerCase()]]?.score || 0);
    return cs || 0;
  };
  const imp = {};
  G.nodes.forEach(n => {
    imp[n.id] = n.kind === "company"
      ? (5 - (n.tier || 4)) * 4 + (CONV_C[n.id]?.band === "double-down" ? 6 : 0) + Math.min(8, Math.sqrt(invW(n.id)))
      : convOf(n) + (RANK[lvl(n.fit)] ?? 0) * 4 + Math.min(10, Math.sqrt(invW(n.id)) * 1.2);
  });
  gx.g = G;
  return gx.c = {G, byId, inv, at, lp, firmByName, resolve, invW, imp, other: (e, id) => e.source === id ? e.target : e.source};
}
const gKind = id => gx().byId[id]?.kind || (bySlug[id] && ["person", "firm", "lp"].includes(bySlug[id].kind) ? bySlug[id].kind : coBySlug[id] ? "company" : "");
const gHref = (id, net) => { const k = gKind(id); return "#graph/" + (net ? (k === "person" || k === "lp" ? k : "net") : ({company: "company", firm: "fund", person: "person", lp: "lp"}[k] || "net")) + "/" + encodeURIComponent(id); };
const gName = id => (gx().byId[id]?.name || bySlug[id]?.name || coBySlug[id]?.name || id).replace(/\s*\(.*?\)/g, "").trim();
const gNames = () => {
  const X = gx(), seen = new Set(), out = [];
  X.G.nodes.forEach(n => { seen.add(n.id); out.push([n.name, n.id, KIND[n.kind]]); });
  V.cos.forEach(c => { if (!seen.has(c.slug) && c.tier <= 3 && c.n_rounds) out.push([c.name, c.slug, "Company"]); });

};

const CL_COLS = [["early", "Pre-seed / Seed", "Seed"], ["a", "Series A", "A"], ["mid", "Series B", "B"], ["late", "Series C+", "C+"], ["late", "Growth / Strategic", "Growth"], ["", "Round unknown", "?"]];
const invSplit = s => { const m = String(s).match(/^(.*?)\s*\((.*)\)\s*$/); return {name: (m ? m[1] : String(s)).trim(), partners: m ? m[2].split(";").map(x => x.trim()).filter(Boolean) : []}; };

      partners.forEach(p => o.partners.add(p));

  list.forEach(o => {
    o.id = X.resolve(o.name);

    const want = view;
    $("main").innerHTML = `<p class="muted loading">${pick(LOADING)}</p>`;
    Promise.all(needs.map(need)).then(() => { if (view === want) route(); })
      .catch(e => { if (view === want) $("main").innerHTML = `<p class="muted">${esc(e.message)}. Check your connection and reload.</p>`; });

{
  // Header search: ranked typeahead over people, funds, LPs and every company (rebuilt when more data loads).
  const norm = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/&/g, " and ").replace(/[^a-z0-9]+/g, " ").trim();
  let IDX = null, idxN = -1, act = 0, hits = [];
  const build = () => {
    const out = [];
    [...A.people, ...A.firms, ...A.lps].forEach(d => out.push({key: d.slug, name: d.name.replace(/\s*\([^)]*\)/g, "").replace(/\s*\(.*$/, "").trim() || d.name, full: d.name, kind: KIND[d.kind] || d.kind,
      sub: d.kind === "person" ? firmShort(d.firm) : [d.known_for, d.take].find(t => t && !/^\(/.test(t.trim())) ? [d.known_for, d.take].find(t => t && !/^\(/.test(t.trim())).slice(0, 80) : "", photo: d.photo, boost: 6 + (RANK[lvl(d.lens_fit)] || 0)}));
    V.cos.forEach(c => { if (bySlug[c.slug] && bySlug[c.slug].kind !== "company") return;
      out.push({key: "co:" + c.slug, name: c.name, full: c.name, kind: "Company", sub: [c.tier_name, c.category, c.latest].filter(Boolean).join(" · "), boost: c.tier === 1 ? 5 : c.tier === 2 ? 3 : c.tier === 3 ? 1 : 0}); });
    out.forEach(o => { o.n = norm(o.full); o.w = o.n.split(" "); o.c = o.n.replace(/ /g, ""); o.s = norm(o.sub); });
    idxN = out.length; return out;
  };
  const score = (o, q, qw) => {
    if (o.n === q) return 100 + o.boost;
    if (o.n.startsWith(q)) return 80 + o.boost;
    if (qw.every(t => o.w.some(w => w.startsWith(t)))) return 60 + o.boost;
    if (o.n.includes(q)) return 40 + o.boost;
    if (o.c.includes(q.replace(/ /g, ""))) return 35 + o.boost;

  const box = $("gres"), inp = $("gfind");

  const render = () => {
    const q = norm(inp.value);
    if (!q) { box.classList.remove("on"); inp.setAttribute("aria-expanded", "false"); return; }
    const total = A.people.length + A.firms.length + A.lps.length + V.cos.length;
    if (!IDX || Math.abs(idxN - total) > total * 0.1) IDX = build();
    const qw = q.split(" ");
    hits = IDX.map(o => [score(o, q, qw), o]).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0] || a[1].name.length - b[1].name.length).slice(0, 12).map(x => x[1]);
    act = Math.min(act, Math.max(hits.length - 1, 0));
    box.innerHTML = hits.length ? hits.map((o, i) => `<div class="gr${i === act ? " act" : ""}" role="option" data-i="${i}">${o.kind === "Person" ? avatar(o.name, o.photo, "") : `<span class="kdot" style="--c:var(--n-${o.kind === "Fund" ? "firm" : o.kind === "LP" ? "lp" : "company"})">${o.kind === "Fund" ? "◆" : o.kind === "LP" ? "▲" : "■"}</span>`}
        <div style="min-width:0"><div class="gn">${hl(o.name, q)}</div>${o.sub ? `<div class="gs2">${esc(o.sub)}</div>` : ""}</div><span class="gk">${esc(o.kind)}</span></div>`).join("") + `<div class="ghint">↑↓ to move · Enter to open · Esc to close</div>`
      : `<div class="gempty">No match for “${esc(inp.value)}”. Try part of a name, a fund or a company.</div>`;
    box.classList.add("on"); inp.setAttribute("aria-expanded", "true");
  };
  const open = i => { const o = hits[i]; if (!o) return; box.classList.remove("on"); inp.value = ""; inp.blur(); openDoc(o.key); };
  inp.oninput = () => { act = 0; render(); };

    else if (e.key === "ArrowUp") { e.preventDefault(); act = Math.max(act - 1, 0); render(); }
    else if (e.key === "Enter") { e.preventDefault(); open(act); }

  const today = new Date().toISOString().slice(0, 10), last = store.get("lastseen", "");

}
